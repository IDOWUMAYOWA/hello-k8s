apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: hello:v1
          ports:
            - containerPort: 8000
          env:
            - name: VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
